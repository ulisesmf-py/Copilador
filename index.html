<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;">
<title>Informatica II</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
/* ── REDESIGNED GLOBAL UI ── */
:root{
  --bg:#070c18;--surface:#0f1729;--surface2:#131d30;--surface3:#192338;
  --accent:#00b4ff;--accent2:#7c3aed;--green:#00ff88;--amber:#ffaa00;--red:#ff4444;
  --text:#e8edf5;--text2:#8fa3bf;--text3:#3d5170;
  --font:'Fira Code',monospace;--radius:10px;
  --green-bg:rgba(0,255,136,0.08);--green-text:#00ff88;
  --amber-bg:rgba(255,170,0,0.08);--amber-text:#ffaa00;
  --red-bg:rgba(255,68,68,0.08);--red-text:#ff4444;
  --accent-bg:rgba(0,180,255,0.08);--accent-text:#00b4ff;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:18px;}
input,select,textarea,button{font-family:var(--font);font-size:17px;color:var(--text);}

/* ── Topbar ── */
.topbar{background:rgba(7,12,24,0.97);border-bottom:1px solid rgba(0,180,255,0.12);padding:0 24px;height:46px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.topbar-logo{color:var(--accent);font-weight:700;font-size:17px;letter-spacing:.05em;}
.topbar-parcial{font-size:17px;color:var(--text3);background:rgba(0,180,255,0.07);padding:3px 12px;border-radius:20px;border:1px solid rgba(0,180,255,0.12);}
.saving-ind{font-size:17px;color:var(--amber);margin-left:auto;opacity:0;transition:opacity .3s;}
.saving-ind.show{opacity:1;}

/* ── Role bars ── */
.role-bar{padding:7px 24px;display:none;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:.06em;}
.role-bar-teacher{background:rgba(124,58,237,0.1);border-bottom:1px solid rgba(124,58,237,0.18);color:#a78bfa;}
.role-bar-student{background:rgba(0,255,136,0.05);border-bottom:1px solid rgba(0,255,136,0.12);color:var(--green);}
.role-bar button{margin-left:auto;background:none;border:1px solid currentColor;color:inherit;padding:3px 12px;border-radius:20px;cursor:pointer;font-size:17px;font-family:var(--font);opacity:.7;transition:opacity .15s;}
.role-bar button:hover{opacity:1;}

/* ── Main Tabs ── */
.tabs{display:flex;gap:2px;padding:16px 24px 0;max-width:900px;margin:0 auto;}
.tab{background:none;border:1px solid rgba(0,180,255,0.12);color:var(--text2);padding:8px 20px;border-radius:8px 8px 0 0;cursor:pointer;font-size:17px;font-family:var(--font);transition:all .15s;letter-spacing:.02em;}
.tab.active{background:linear-gradient(180deg,rgba(0,180,255,0.12),rgba(0,180,255,0.06));border-color:rgba(0,180,255,0.3);color:var(--accent);border-bottom-color:transparent;box-shadow:0 -2px 12px rgba(0,180,255,0.1);}
.tab:hover:not(.active){color:var(--text);border-color:rgba(0,180,255,0.22);}

/* ── Sections ── */
.sections{padding:0 20px 28px;max-width:880px;margin:0 auto;}
.section{display:none;}
.section.active{display:block !important;}

/* ── Cards ── */
.card{background:linear-gradient(145deg,rgba(15,23,41,0.95),rgba(11,17,33,0.98));border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px 20px;margin-bottom:.75rem;box-shadow:0 2px 16px rgba(0,0,0,0.25);}
.card-click{cursor:pointer;transition:border-color .15s,transform .1s;}
.card-click:hover{border-color:rgba(0,180,255,0.32);transform:translateY(-1px);}

/* ── Login ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:72vh;padding:20px;}
.login-box{background:var(--surface);border:1px solid rgba(0,180,255,0.18);border-radius:16px;padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.login-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;border:1px solid rgba(0,180,255,0.2);background:linear-gradient(135deg,#0d1e3a,#071328);}
.login-icon i{font-size:24px;color:var(--accent);}
.login-box h2{font-size:22px;font-weight:700;margin-bottom:8px;}
.login-box p{font-size:18px;color:var(--text2);margin-bottom:22px;line-height:1.6;}

/* ── Forms ── */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:17px;font-weight:700;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--text);transition:all .2s;outline:none;font-size:16px;box-shadow:inset 0 1px 4px rgba(0,0,0,0.3);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(0,180,255,0.5);background:rgba(0,180,255,0.05);box-shadow:inset 0 1px 4px rgba(0,0,0,0.2),0 0 0 2px rgba(0,180,255,0.1);}
.form-group select option{background:var(--surface);}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:18px;color:var(--text2);cursor:pointer;margin-bottom:10px;}

/* ── Buttons ── */
.btn{padding:9px 18px;border-radius:8px;border:1px solid;cursor:pointer;font-size:18px;font-family:var(--font);font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn i{font-size:17px;}
.btn-primary{background:rgba(0,180,255,0.1);border-color:rgba(0,180,255,0.3);color:var(--accent);box-shadow:0 0 20px rgba(0,180,255,0.08);}
.btn-primary:hover{background:rgba(0,180,255,0.22);border-color:rgba(0,180,255,0.55);}
.btn-success{background:rgba(0,255,136,0.08);border-color:rgba(0,255,136,0.28);color:var(--green);box-shadow:0 0 20px rgba(0,255,136,0.06);}
.btn-success:hover{background:rgba(0,255,136,0.18);}
.btn-danger{background:rgba(255,68,68,0.08);border-color:rgba(255,68,68,0.3);color:var(--red);}
.btn-danger:hover{background:rgba(255,68,68,0.16);}
.btn-full{width:100%;justify-content:center;}
.btn-sm{padding:5px 12px;font-size:17px;}

/* ── Inner Tabs ── */
.inner-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;padding:12px 0 12px;border-bottom:1px solid rgba(0,180,255,0.08);}
.inner-tabs .tab{border-radius:20px;padding:6px 16px;font-size:17px;border-bottom-color:rgba(0,180,255,0.12);}

/* ── Panel ── */
.panel{background:linear-gradient(145deg,rgba(19,29,48,0.9),rgba(15,23,41,0.95));border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px 20px;margin-bottom:.75rem;box-shadow:0 2px 20px rgba(0,0,0,0.3);}
.panel-title{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:.75rem;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.07em;}
.panel-title i{font-size:18px;}

/* ── Grade Cards (Student) ── */
.grade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1rem;}
.grade-stat{background:linear-gradient(145deg,rgba(19,29,48,0.9),rgba(13,20,38,0.95));border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.grade-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent);}
.grade-stat .val{font-size:34px;font-weight:900;line-height:1;color:var(--text);margin-bottom:6px;}
.grade-stat .lbl{font-size:18px;color:var(--text2);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;}
.grade-stat .sub{font-size:17px;color:var(--text3);}

/* ── Level Card ── */
.level-card{border-radius:12px;padding:18px 20px;margin-bottom:.75rem;position:relative;overflow:hidden;}
.level-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── Criteria rows (old) ── */
.criteria-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,180,255,0.07);}
.criteria-row:last-child{border-bottom:none;}
.criteria-grade{font-size:22px;font-weight:800;min-width:48px;text-align:right;}
.criteria-grade.high{color:var(--green);}
.criteria-grade.mid{color:var(--amber);}
.criteria-grade.low{color:var(--red);}
.progress-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:10px;margin-top:6px;overflow:hidden;}
.progress-bar{height:100%;border-radius:10px;transition:width .6s ease;}

/* ── Stepper ── */
.stepper{display:flex;gap:0;margin-bottom:.75rem;}
.step{flex:1;padding:10px 12px;background:var(--surface2);border:1px solid rgba(0,180,255,0.1);text-align:center;font-size:18px;font-weight:600;color:var(--text3);transition:all .2s;}
.step:first-child{border-radius:10px 0 0 10px;}
.step:last-child{border-radius:0 10px 10px 0;}
.step.current{background:rgba(0,180,255,0.1);border-color:rgba(0,180,255,0.35);color:var(--accent);}
.step.done{background:rgba(0,255,136,0.07);border-color:rgba(0,255,136,0.2);color:var(--green-text);}
.step-sub{font-size:18px;font-weight:800;margin-top:4px;}

/* ── Parcial tabs ── */
.parcial-tabs{display:flex;gap:8px;margin-bottom:.75rem;flex-wrap:wrap;}
.parcial-tab{padding:6px 16px;border-radius:20px;border:1px solid rgba(0,180,255,0.15);background:none;color:var(--text2);cursor:pointer;font-size:17px;font-family:var(--font);}
.parcial-tab.active{background:rgba(0,180,255,0.12);border-color:rgba(0,180,255,0.4);color:var(--accent);}
.parcial-tab.active-cur{background:rgba(0,255,136,0.1);border-color:rgba(0,255,136,0.35);color:var(--green);}

/* ── Attend ── */
.attend-msg{padding:10px 14px;border-radius:8px;font-size:18px;font-weight:600;margin-bottom:.75rem;display:flex;align-items:center;gap:8px;}
.attend-blocked{background:rgba(255,68,68,0.08);color:var(--red);border:1px solid rgba(255,68,68,0.22);}
.attend-perfect{background:rgba(0,255,136,0.07);color:var(--green);border:1px solid rgba(0,255,136,0.18);}
.attend-good{background:rgba(0,255,136,0.05);color:var(--green);border:1px solid rgba(0,255,136,0.14);}
.attend-warn{background:rgba(255,170,0,0.07);color:var(--amber);border:1px solid rgba(255,170,0,0.18);}
.attend-danger{background:rgba(255,68,68,0.07);color:var(--red);border:1px solid rgba(255,68,68,0.14);}
.attend-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:17px;font-weight:700;}
.pill-p{background:rgba(0,255,136,0.15);color:var(--green);}
.pill-f{background:rgba(255,68,68,0.15);color:var(--red);}
.pill-j{background:rgba(255,170,0,0.15);color:var(--amber);}
.pill-n{background:var(--surface3);color:var(--text3);}

/* ── Forum ── */
.question-card h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.preview{font-size:18px;color:var(--text2);margin-bottom:10px;line-height:1.5;}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:18px;font-weight:700;}
.badge i{font-size:18px;}
.badge-green{background:rgba(0,255,136,0.1);color:var(--green);border:1px solid rgba(0,255,136,0.2);}
.badge-amber{background:rgba(255,170,0,0.1);color:var(--amber);border:1px solid rgba(255,170,0,0.2);}
.badge-red{background:rgba(255,68,68,0.1);color:var(--red);border:1px solid rgba(255,68,68,0.2);}
.badge-gray{background:var(--surface2);color:var(--text2);border:1px solid rgba(0,180,255,0.1);}
.week-tag{font-size:18px;color:var(--text3);padding:2px 8px;background:var(--surface2);border-radius:20px;}
.reply-card{background:var(--surface3);border-radius:8px;padding:12px 14px;margin-bottom:10px;}
.reply-author{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.reply-text{font-size:18px;line-height:1.6;color:var(--text);}
.reply-time{font-size:18px;color:var(--text3);margin-top:6px;}
.reply-actions{margin-top:8px;display:flex;gap:8px;}
.nested-replies{margin-top:10px;padding-left:12px;border-left:2px solid rgba(0,180,255,0.15);}
.nested-reply{background:rgba(0,180,255,0.03);border-radius:6px;padding:8px 12px;margin-bottom:6px;}
.inline-reply-form{display:none;background:var(--surface);border:1px solid rgba(0,180,255,0.15);border-radius:8px;padding:12px;margin-top:10px;}
.inline-reply-form input,.inline-reply-form textarea{width:100%;background:var(--surface2);border:1px solid rgba(0,180,255,0.15);border-radius:6px;padding:7px 10px;color:var(--text);outline:none;margin-bottom:8px;font-size:18px;}
.timer-bar{padding:8px 14px;border-radius:8px;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.timer-open{background:rgba(0,255,136,0.07);color:var(--green);border:1px solid rgba(0,255,136,0.2);}
.timer-soon{background:rgba(255,170,0,0.07);color:var(--amber);border:1px solid rgba(255,170,0,0.2);}
.timer-closed{background:rgba(255,68,68,0.07);color:var(--red);border:1px solid rgba(255,68,68,0.2);}
.detail-header h2{font-size:20px;font-weight:700;margin-bottom:8px;}
.body-text{font-size:18px;color:var(--text2);line-height:1.6;margin-bottom:10px;}
.divider{border:none;border-top:1px solid rgba(0,180,255,0.08);margin:1rem 0;}

/* ── Motivational ── */
.motivational{background:linear-gradient(135deg,rgba(0,180,255,0.05),rgba(124,58,237,0.05));border:1px solid rgba(0,180,255,0.1);border-radius:10px;padding:14px 18px;margin-bottom:.75rem;font-size:18px;color:var(--text2);line-height:1.7;}
.mauthor{font-size:18px;color:var(--text3);margin-top:6px;}

/* ── Teacher ── */
.stu-nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.stu-dot{width:38px;height:38px;border-radius:50%;background:rgba(0,180,255,0.08);border:1.5px solid rgba(0,180,255,0.18);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;font-weight:700;color:var(--accent);transition:all .15s;}
.stu-dot:hover{background:rgba(0,180,255,0.15);border-color:rgba(0,180,255,0.4);}
.stu-dot.active-stu{background:rgba(0,180,255,0.2);border-color:var(--accent);box-shadow:0 0 10px rgba(0,180,255,0.3);}
.gi-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
.gi-wrap label{font-size:17px;color:var(--text3);max-width:58px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gi-wrap input{width:58px;text-align:center;padding:5px 4px;background:var(--surface3);border:1px solid rgba(0,180,255,0.15);border-radius:6px;color:var(--text);font-size:17px;}
.gi-wrap input:focus{border-color:var(--accent);outline:none;}
.attend-btn{width:50px;height:36px;border-radius:7px;border:1px solid rgba(0,180,255,0.15);background:var(--surface3);color:var(--text2);cursor:pointer;font-size:17px;font-weight:700;font-family:var(--font);transition:all .15s;}
.attend-btn:hover{border-color:rgba(0,180,255,0.35);}
.attend-btn.P{background:rgba(0,255,136,0.12);border-color:rgba(0,255,136,0.3);color:var(--green);}
.attend-btn.F{background:rgba(255,68,68,0.12);border-color:rgba(255,68,68,0.3);color:var(--red);}
.attend-btn.J{background:rgba(255,170,0,0.12);border-color:rgba(255,170,0,0.3);color:var(--amber);}
.sub-grade-input{width:72px;text-align:center;padding:7px 8px;font-size:17px;font-weight:700;background:#050a14;border:1px solid rgba(0,180,255,0.2);border-radius:7px;color:var(--text);font-family:var(--font);}
.sub-grade-input:focus{border-color:var(--accent);outline:none;}

/* ── Compiler ── */
.example-chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:18px;padding:4px 12px;border-radius:20px;border:1px solid rgba(0,180,255,0.18);background:rgba(0,180,255,0.06);color:var(--text2);cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,180,255,0.12);}
.code-editor-wrap{border:1px solid rgba(0,180,255,0.14);border-radius:9px;overflow:hidden;margin-bottom:10px;}
.code-editor-header{background:#1e1e2e;padding:8px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(0,180,255,0.1);}
.editor-dots{display:flex;gap:5px;}
.dot-r,.dot-y,.dot-g{width:11px;height:11px;border-radius:50%;}
.dot-r{background:#ff5f57;}.dot-y{background:#ffbd2e;}.dot-g{background:#28c840;}
.editor-filename{font-size:18px;color:var(--text2);flex:1;}
.editor-ver{font-size:17px;color:var(--text3);}
.code-editor-body{display:flex;flex-direction:row;height:380px;max-height:380px;overflow:hidden;background:#1e1e1e;}
.line-numbers{padding:14px 6px 14px 10px;font-size:15px;line-height:1.65;color:#555;text-align:right;user-select:none;width:42px;min-width:42px;max-width:42px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:#1e1e1e;white-space:pre;flex-shrink:0;display:block;align-self:stretch;}
.code-area{flex:1;position:relative;overflow:hidden;min-width:0;height:100%;}
.code-highlight{position:absolute;top:0;left:0;right:0;bottom:0;padding:14px;font-size:15px;line-height:1.65;pointer-events:none;white-space:pre;overflow:auto;font-family:'Fira Code',monospace;}
.code-textarea{position:absolute;top:0;left:0;right:0;bottom:0;padding:14px;font-size:15px;line-height:1.65;background:transparent;border:none;outline:none;resize:none;color:transparent;caret-color:#fff;white-space:pre;overflow:auto;font-family:'Fira Code',monospace;z-index:1;}
.run-btn{background:rgba(0,180,255,0.14);border:1px solid rgba(0,180,255,0.38);color:var(--accent);padding:9px 18px;border-radius:8px 0 0 8px;cursor:pointer;font-size:18px;font-family:var(--font);font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
.run-btn:hover{background:rgba(0,180,255,0.26);}
.clear-btn{background:var(--surface2);border:1px solid rgba(0,180,255,0.1);border-left:none;color:var(--text2);padding:9px 14px;cursor:pointer;font-size:17px;font-family:var(--font);display:inline-flex;align-items:center;gap:5px;transition:all .15s;border-radius:0;}
.clear-btn:hover{border-color:rgba(0,180,255,0.28);color:var(--text);}
.clear-btn:last-of-type{border-radius:0 8px 8px 0;}
.terminal-wrap{border:1px solid rgba(0,180,255,0.12);border-radius:9px;overflow:hidden;margin-top:8px;}
.terminal-header{background:#111827;padding:7px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,180,255,0.09);}
.terminal-title{font-size:18px;color:var(--text3);}
.terminal-body{background:#090e1a;padding:10px 14px;min-height:90px;max-height:180px;overflow-y:auto;font-family:'Fira Code',monospace;font-size:22px !important;line-height:1.9 !important;white-space:pre-wrap;word-break:break-word;overflow-x:hidden;}
.tl{line-height:1.9 !important;white-space:pre-wrap;word-break:break-word;font-size:22px !important;}
.t-out{color:#d4d4d4;font-size:22px !important;}.t-err{color:#f44747;font-size:22px !important;}.t-info{color:#569cd6;font-size:22px !important;}.t-success{color:#00ff88;font-size:22px !important;}
.t-input-label{color:#4ec9b0;}.t-input-field{background:none;border:none;outline:none;color:#fff;font-family:'Fira Code',monospace;font-size:22px;caret-color:#00ff88;min-width:200px;}
.tcursor{display:inline-block;width:9px;height:16px;background:#00ff88;animation:blink 1s step-end infinite;vertical-align:middle;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ── Toast & Celebration ── */

.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.cel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9999;}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getDatabase,ref,set,get,onValue} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const fbApp=initializeApp({apiKey:"AIzaSyDIucPhIp0gSLPcmCUTYrY7CJx5LYBzCQU",authDomain:"foro-ee8a5.firebaseapp.com",databaseURL:"https://foro-ee8a5-default-rtdb.firebaseio.com",projectId:"foro-ee8a5",storageBucket:"foro-ee8a5.firebasestorage.app",messagingSenderId:"548605948271",appId:"1:548605948271:web:6d903b2432429d7a04b89a"});
const db=getDatabase(fbApp);
const auth=getAuth(fbApp);
const PATH='informatica2v2'; // Fresh path — clean slate

// ════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════
const TEACHER_PASS='profesor123';
const ROSTER=[
  {mat:'262016420',name:'CASTRO ROSAS AMERICA NASLIRANI'},
  {mat:'263046700',name:'GARCIA CASAS EVANY TADEO'},
  {mat:'262116190',name:'GODINEZ REYES PAOLA NATALI'},
  {mat:'262116208',name:'GUERRERO GARCIA KARLA MELANY'},
  {mat:'261065103',name:'LOPEZ MARTINEZ MARTHA REBECA'},
  {mat:'263036573',name:'PEREZ FLORES BRANDON GAEL'},
  {mat:'262126256',name:'SALAZAR CARDENAS LESLY VALERIA'},
  {mat:'263046697',name:'SANCHEZ AVILA IVAN EDAHI'},
  {mat:'262016326',name:'VELEZ SANCHEZ ANGIE DANIELA'}
];
const DEFAULT_CRITERIA=[
  {key:'examen',label:'Examen',weight:40,icon:'ti-clipboard-check',freq:'parcial'},
  {key:'foro',label:'Foros de Debate',weight:20,icon:'ti-message-circle',freq:'semana'},
  {key:'matriz',label:'Matriz de Cursos',weight:30,icon:'ti-table',freq:'semana'},
  {key:'analisis',label:'Analisis de Casos',weight:10,icon:'ti-presentation',freq:'parcial'}
];
const PERIODS=[{key:'p1',label:'Primer Parcial',short:'1er Parcial'},{key:'p2',label:'Segundo Parcial',short:'2do Parcial'},{key:'pf',label:'Final',short:'Final'}];

// Email local-part → Matrícula mapping (from @student.blackai.com accounts)
const EMAIL_MAP={
  'america':'262016420',
  'tadeo':'263046700',
  'natali':'262116190',
  'melany':'262116208',
  'martha':'261065103',
  'brandon':'263036573',
  'lesly':'262126256',
  'ivan':'263046697',
  'angie':'262016326',
};
const MAX_FALTAS=3;

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let isTeacher=false;
let currentStudent=null;
let studentTab='inicio';
let viewingParcial='p1';
let teacherStudentIdx=0;
let teacherTab='student';
let questions=[];
let replies={};
let grades={};
let attendance={};
let sessions={};
let codeSubmissions={};
let CRITERIA=[...DEFAULT_CRITERIA];
let config={activePeriod:'p1',activeSession:null,periods:{p1:{start:'',end:''},p2:{start:'',end:''},pf:{start:'',end:''}},criteria:null,rubricsConfigured:false,weekdays:[1,3],activitiesPerWeek:1};
let _fbReady=false;

// ════════════════════════════════════════
// FIREBASE
// ════════════════════════════════════════
async function saveAll(){
  document.getElementById('saving-ind').classList.add('show');
  // Primary save — all app data
  await set(ref(db,PATH),{questions,replies,grades,attendance,sessions,codeSubmissions,config});
  // Sync grades to /grades/{mat}/informatica2/ — fire and forget (non-blocking)
  // Requires Firebase rules to allow write on /grades/ path
  setTimeout(()=>{
    try{
      const syncPromises=[];
      for(const mat of Object.keys(grades)){
        const syncData={};
        for(const [pkey] of Object.entries(grades[mat]||{})){
          const parcialLabel=pkey==='p1'?'parcial1':pkey==='p2'?'parcial2':'final';
          const fg=calcFinalGrade(mat,pkey);
          syncData[parcialLabel]={score:fg!==null?parseFloat(fg.toFixed(2)):null,updated:Date.now()};
        }
        if(Object.keys(syncData).length)
          syncPromises.push(set(ref(db,`grades/${mat}/informatica2`),syncData).catch(()=>{}));
      }
      if(syncPromises.length)Promise.all(syncPromises).catch(()=>{});
    }catch(e){}
  },0);
  setTimeout(()=>document.getElementById('saving-ind').classList.remove('show'),800);
}

async function loadAll(){
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),6000));
  try{
    const snap=await Promise.race([get(ref(db,PATH)),timeout]);
    if(snap.exists()){
      const d=snap.val();
      questions=d.questions||[];replies=d.replies||{};grades=d.grades||{};
      attendance=d.attendance||{};sessions=d.sessions||{};codeSubmissions=d.codeSubmissions||{};
      if(d.config)config={...config,...d.config};
      if(config.activeSession===undefined)config.activeSession=null;
    }
    if(config.criteria?.length)CRITERIA=config.criteria;
  }catch(e){
    console.warn('Firebase load:',e.message);
    // App works offline — grades/sessions will be empty until reconnected
  }
  _fbReady=true;
  updateTopbar();
}

// Auto-restore session from Firebase Auth state
onAuthStateChanged(auth,user=>{
  if(user&&!currentStudent&&!isTeacher){
    // Restore student session from Firebase Auth
    const localPart=user.email.split('@')[0].toLowerCase();
    const mat=EMAIL_MAP[localPart]||localPart;
    const match=ROSTER.find(r=>r.mat===mat);
    if(match){
      currentStudent=match;
      viewingParcial=config.activePeriod;
      document.getElementById('role-bar-student').style.display='flex';
      document.getElementById('stu-bar-name').textContent=firstNames(match.name)+' · '+getLevel(calcGlobalGrade(match.mat)).badge;
      if(_fbReady){showSection('students');showStudentDash();}
    }
  }
});

function startListener(){
  onValue(ref(db,PATH),snap=>{
    if(!snap.exists()||!_fbReady)return;
    const d=snap.val();
    questions=d.questions||[];replies=d.replies||{};grades=d.grades||{};
    attendance=d.attendance||{};sessions=d.sessions||{};codeSubmissions=d.codeSubmissions||{};
    if(d.config)config={...config,...d.config};
    if(config.criteria?.length)CRITERIA=config.criteria;
    updateTopbar();
    // Only re-render if NOT in a login transition
    if(window._navLock)return;
    // Only re-render the CURRENTLY VISIBLE section
    const stuVisible=document.getElementById('students-section')?.classList.contains('active');
    const teaVisible=document.getElementById('teacher-section')?.classList.contains('active');
    if(isTeacher&&(teaVisible||!stuVisible)){
      const ae=document.activeElement;
      const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
      if(!typing)renderTeacherPanel();
    }
    if(currentStudent&&stuVisible){
      if(viewingParcial!==config.activePeriod&&studentTab==='inicio')viewingParcial=config.activePeriod;
      if(studentTab==='cpp'||studentTab==='python'||studentTab==='frontend'){
        try{const lv=getLevel(calcGlobalGrade(currentStudent.mat));const b=document.getElementById('stu-bar-name');if(b)b.textContent=firstNames(currentStudent.name)+' · '+lv.badge+' '+lv.name;}catch(ex){}
      } else {
        renderStudentDashboard();
      }
    }
  });
}

// ════════════════════════════════════════
// UTILS
// ════════════════════════════════════════
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,duration=2600){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),duration);}
function celebrate(emoji,title,msg){const el=document.getElementById('celebration');document.getElementById('cel-emoji').textContent=emoji;document.getElementById('cel-title').textContent=title;document.getElementById('cel-msg').textContent=msg;el.classList.add('show');}
function updateTopbar(){const p=PERIODS.find(x=>x.key===config.activePeriod)||PERIODS[0];document.getElementById('topbar-parcial').textContent=p.short;}
function firstNames(name){return(name||'').split(' ').slice(-2).join(' ');}
function getSessions(pkey){return sessions[pkey]||[];}
function getStatus(q){if(!q.closesAt)return'open';const d=q.closesAt-Date.now();if(d<=0)return'closed';if(d<3600000)return'soon';return'open';}
function timeLeft(ts){const d=ts-Date.now();if(d<=0)return'cerrado';const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000);if(h>24)return Math.floor(h/24)+'d';if(h>0)return h+'h '+m+'m';return m+' min';}
function fmtDate(ts){return new Date(ts).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});}
function countReplies(qid){return(replies[qid]||[]).reduce((a,r)=>a+1+(r.replies?.length||0),0);}

function barColor(v){if(v===null||v===undefined)return'#4a5a7a';if(v>=9)return'var(--green)';if(v>=7)return'var(--amber)';return'var(--red)';}
function gradeColor(v){if(v===null||v===undefined)return'none';if(v>=9)return'high';if(v>=7)return'mid';return'low';}

function calcFaltas(mat,pkey){
  const sess=getSessions(pkey);let f=0,j=0,p=0;
  for(const s of sess){const v=(attendance[pkey]||{})[s.id]?.[mat];if(v==='F')f++;else if(v==='J')j++;else if(v==='P')p++;}
  return{faltas:f,justificantes:j,presentes:p,total:sess.length};
}

function calcCriteriaGrade(mat,key,freq,pkey){
  const g=grades[mat]?.[pkey]?.[key];
  if(freq==='semana'||freq==='actividad'){
    if(!g||typeof g!=='object')return null;
    const vals=Object.values(g).map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&v>=0&&v!==null);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
  }
  const v=parseFloat(g);return isNaN(v)?null:v;
}

function calcFinalGrade(mat,pkey){
  let total=0,has=false;
  for(const c of CRITERIA){const g=calcCriteriaGrade(mat,c.key,c.freq,pkey);if(g!==null){total+=g*(c.weight/100);has=true;}}
  return has?Math.min(10,total):null;
}

function calcGlobalGrade(mat){
  const v=[calcFinalGrade(mat,'p1'),calcFinalGrade(mat,'p2')].filter(x=>x!==null);
  return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
}

function getLevel(avg){
  if(avg===null||avg===undefined)return{name:'Invitado',icon:'ti-ghost',color:'#4a5a7a',bg:'rgba(74,90,122,0.1)',badge:'👾',next:null};
  if(avg>=9.5)return{name:'Arquitecto',icon:'ti-cpu',color:'#ff00ff',bg:'rgba(255,0,255,0.1)',badge:'🏆',next:null};
  if(avg>=9.0)return{name:'Senior Developer',icon:'ti-rocket',color:'#ffaa00',bg:'rgba(255,170,0,0.1)',badge:'🚀',next:{label:'Arquitecto',at:9.5}};
  if(avg>=8.0)return{name:'Mid-Level Dev',icon:'ti-code',color:'#00ff88',bg:'rgba(0,255,136,0.1)',badge:'⚡',next:{label:'Senior',at:9.0}};
  if(avg>=7.0)return{name:'Junior Dev',icon:'ti-terminal-2',color:'#00b4ff',bg:'rgba(0,180,255,0.1)',badge:'💻',next:{label:'Mid-Level',at:8.0}};
  if(avg>=6.0)return{name:'Amateur Coder',icon:'ti-keyboard',color:'#8899bb',bg:'rgba(136,153,187,0.1)',badge:'🎯',next:{label:'Junior',at:7.0}};
  return{name:'Bug Hunter',icon:'ti-bug',color:'#ff6666',bg:'rgba(255,102,102,0.1)',badge:'🐛',next:{label:'Amateur',at:6.0}};
}

// ════════════════════════════════════════
// NAVIGATION — The only reliable way
// ════════════════════════════════════════
function showSection(name){
  window._navLock=true;
  clearTimeout(window._navLockTimer);
  window._navLockTimer=setTimeout(()=>{window._navLock=false;},2000);

  // Toggle sections via both style and class
  const stuSec=document.getElementById('students-section');
  const teaSec=document.getElementById('teacher-section');
  if(stuSec){
    stuSec.style.display=name==='students'?'block':'none';
    stuSec.classList.toggle('active',name==='students');
  }
  if(teaSec){
    teaSec.style.display=name==='teacher'?'block':'none';
    teaSec.classList.toggle('active',name==='teacher');
  }

  // Toggle tab buttons
  document.getElementById('tab-students').classList.toggle('active',name==='students');
  document.getElementById('tab-teacher').classList.toggle('active',name==='teacher');
}

window.showTab=function(name,e){
  if(e){e.preventDefault();e.stopPropagation();}
  window.scrollTo({top:0,behavior:'instant'});
  showSection(name);
  if(name==='students'){
    if(currentStudent)showStudentDash();
    else showStudentLogin();
  }
  if(name==='teacher'){
    if(isTeacher)showTeacherPanel();
    else showTeacherLogin();
  }
};

// ════════════════════════════════════════
// STUDENT AUTH
// ════════════════════════════════════════
function showStudentLogin(){
  const loginEl=document.getElementById('stu-login');
  const dashEl=document.getElementById('stu-dash');
  if(loginEl)loginEl.style.display='block';
  if(dashEl)dashEl.style.display='none';
  // Clear error, restore saved user if remembered
  const errEl=document.getElementById('stu-error');
  if(errEl)errEl.style.display='none';
  try{
    const saved=localStorage.getItem('inf2v2-student');
    if(saved){
      const pf=JSON.parse(saved);
      const matEl=document.getElementById('stu-mat');
      const remEl=document.getElementById('stu-rem');
      if(matEl&&(pf.mat||pf.email)){matEl.value=pf.email?pf.email.split('@')[0]:pf.mat;}
      if(remEl)remEl.checked=true;
    }
  }catch(e){localStorage.removeItem('inf2v2-student');}
}

window.doLogin=async function(){
  const userInput=(document.getElementById('stu-mat')?.value||'').trim();
  const pwd=document.getElementById('stu-pwd')?.value||'';
  const rem=document.getElementById('stu-rem')?.checked;
  const errEl=document.getElementById('stu-error');
  const btn=document.getElementById('stu-entrar-btn');
  if(!userInput){if(errEl){errEl.textContent='Ingresa tu usuario';errEl.style.display='block';}return;}
  if(!pwd){if(errEl){errEl.textContent='Ingresa tu contraseña';errEl.style.display='block';}return;}
  if(errEl)errEl.style.display='none';
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Verificando...';}
  const email=userInput.includes('@')?userInput:userInput+'@student.blackai.com';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,pwd);
    const uid=cred.user.uid;
    // Match student by email/uid against ROSTER
    // Email format: matricula@student.blackai.com or nombre@student.blackai.com
    const localPart=email.split('@')[0].toLowerCase();
    const mat=EMAIL_MAP[localPart]||localPart;
    const student=ROSTER.find(r=>r.mat===mat);
    if(!student){
      if(errEl){errEl.textContent='Cuenta no encontrada en el grupo. Contacta al profesor.';errEl.style.display='block';}
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Entrar al Aula 🚀';}
      return;
    }
    currentStudent=student;
    viewingParcial=config.activePeriod;
    studentTab='inicio';
    if(rem)localStorage.setItem('inf2v2-student',JSON.stringify({mat:student.mat,name:student.name,email}));
    else localStorage.removeItem('inf2v2-student');
    document.getElementById('role-bar-student').style.display='flex';
    document.getElementById('stu-bar-name').textContent=firstNames(student.name)+' · '+getLevel(calcGlobalGrade(student.mat)).badge;
    speakWelcome(firstNames(student.name));
    showSection('students');
    showStudentDash();
  }catch(e){
    const msg=e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'Contraseña incorrecta':
              e.code==='auth/user-not-found'?'Usuario no encontrado. Verifica tu matrícula':
              e.code==='auth/too-many-requests'?'Demasiados intentos. Espera unos minutos.':
              e.code==='auth/invalid-email'?'Formato de usuario inválido':
              'Error: '+e.code;
    if(errEl){errEl.textContent=msg;errEl.style.display='block';}
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Entrar al Aula 🚀';}
  }
};

window.logoutStudent=async function(){
  currentStudent=null;
  localStorage.removeItem('inf2v2-student');
  try{await signOut(auth);}catch(e){}
  document.getElementById('role-bar-student').style.display='none';
  showSection('students');
  showStudentLogin();
};

function showStudentDash(){
  document.getElementById('stu-login').style.display='none';
  document.getElementById('stu-dash').style.display='block';
  renderStudentDashboard();
}

function showTeacherLogin(){
  const tl=document.getElementById('tea-login');
  const tp=document.getElementById('tea-panel');
  if(tl)tl.style.display='block';
  if(tp)tp.style.display='none';
  const pwd=document.getElementById('tea-pwd');
  const user=document.getElementById('tea-user');
  const err=document.getElementById('tea-error');
  if(pwd)pwd.value='';
  if(user)user.value='';
  if(err)err.style.display='none';
}

window.doTeacherLogin=async function(){
  const userEl=document.getElementById('tea-user');
  const pwdEl=document.getElementById('tea-pwd');
  const errEl=document.getElementById('tea-error');
  const btn=document.getElementById('tea-entrar-btn');
  const user=(userEl?.value||'').trim();
  const pwd=pwdEl?.value||'';
  if(!user){toast('Ingresa tu usuario');return;}
  if(!pwd){toast('Ingresa tu contraseña');return;}
  const email=user.includes('@')?user:user+'@master.blackai.com';
  if(errEl)errEl.style.display='none';
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Verificando...';}
  try{
    await signInWithEmailAndPassword(auth,email,pwd);
    isTeacher=true;
    document.getElementById('role-bar-teacher').style.display='flex';
    document.getElementById('tea-bar-label').textContent='Profesor activo — '+email.split('@')[0];
    speakWelcome(email.split('@')[0],true);
    showSection('teacher');
    showTeacherPanel();
  }catch(e){
    const msg=e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'?'Contraseña incorrecta':
              e.code==='auth/user-not-found'?'Usuario no encontrado':
              e.code==='auth/too-many-requests'?'Demasiados intentos. Espera un momento.':
              'Error de autenticación: '+e.code;
    if(errEl){errEl.textContent=msg;errEl.style.display='block';}
    else toast(msg);
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-login"></i> Entrar al Aula';}
  }
};

window.logoutTeacher=async function(){
  isTeacher=false;
  try{await signOut(auth);}catch(e){}
  document.getElementById('role-bar-teacher').style.display='none';
  showSection('teacher');
  showTeacherLogin();
};

function showTeacherPanel(){
  document.getElementById('tea-login').style.display='none';
  document.getElementById('tea-panel').style.display='block';
  window.scrollTo({top:0,behavior:'instant'});
  renderTeacherPanel();
}

function renderStudentDashboard(){
  const dash=document.getElementById('stu-dash');
  if(!dash||!currentStudent)return;
  const mat=currentStudent.mat;
  const vp=viewingParcial||config.activePeriod;

  const tabs=`<div class="inner-tabs">
    <button class="tab ${studentTab==='inicio'?'active':''}" onclick="setStudentTab('inicio')"><i class="ti ti-home"></i> Inicio</button>
    <button class="tab ${studentTab==='foro'?'active':''}" onclick="setStudentTab('foro')"><i class="ti ti-message-circle"></i> Foro</button>
    <button class="tab ${studentTab==='cpp'?'active':''}" onclick="setStudentTab('cpp')"><i class="ti ti-brand-cpp"></i> C++</button>
    <button class="tab ${studentTab==='python'?'active':''}" onclick="setStudentTab('python')"><i class="ti ti-brand-python"></i> Python</button>
    <button class="tab ${studentTab==='codigos'?'active':''}" onclick="setStudentTab('codigos')"><i class="ti ti-file-code"></i> Códigos</button>
    <button class="tab ${studentTab==='frontend'?'active':''}" onclick="setStudentTab('frontend')" style="background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(0,180,255,0.1));border-color:rgba(124,58,237,0.4);color:#a78bfa;"><i class="ti ti-wand"></i> Frontend AI</button>
  </div>`;

  if(studentTab==='foro'){dash.innerHTML=tabs+renderForumHTML();bindForumEvents();return;}
  if(studentTab==='cpp'){dash.innerHTML=tabs+'<div id="cpp-mount"></div>';buildEditor('cpp-mount','cpp','main.cpp','C++17');return;}
  if(studentTab==='python'){dash.innerHTML=tabs+'<div id="py-mount"></div>';buildEditor('py-mount','py','script.py','Python 3.11');return;}
  if(studentTab==='codigos'){dash.innerHTML=tabs+renderMySubmissions(mat);return;}
  if(studentTab==='frontend'){dash.innerHTML=tabs+'<div id="fe-mount"></div>';renderFrontendTab('fe-mount');return;}

  // ── Inicio ──
  const fg=calcFinalGrade(mat,vp);
  const globalG=calcGlobalGrade(mat);
  const lvAvg=globalG!==null?globalG:fg;
  const lv=getLevel(lvAvg);
  const {faltas,justificantes,presentes,total}=calcFaltas(mat,vp);
  const sinDer=faltas>=MAX_FALTAS;
  const ruOk=config.rubricsConfigured&&CRITERIA.length;

  const levelCard=`<div class="level-card fade-up" style="background:${lv.bg};border:1px solid ${lv.color}33;">
    <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:44px;opacity:.12;">${lv.badge}</div>
    <div style="display:flex;align-items:flex-start;gap:14px;">
      <div class="level-icon" style="background:${lv.color}22;border:1px solid ${lv.color}55;"><i class="ti ${lv.icon}" style="font-size:22px;color:${lv.color};"></i></div>
      <div style="flex:1;">
        <p style="font-size:18px;text-transform:uppercase;letter-spacing:.12em;color:${lv.color};font-weight:700;margin-bottom:2px;">// Nivel actual</p>
        <p style="font-size:17px;font-weight:700;color:${lv.color};margin-bottom:3px;">${lv.badge} ${lv.name}</p>
        ${lv.next?`<div style="margin-top:8px;"><div style="display:flex;justify-content:space-between;font-size:17px;color:${lv.color};opacity:.7;margin-bottom:4px;"><span>Siguiente: ${lv.next.label}</span><span>${lvAvg!==null?lvAvg.toFixed(1):'?'} / ${lv.next.at}</span></div><div style="height:5px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden;"><div style="height:100%;background:${lv.color};border-radius:10px;width:${lvAvg!==null?Math.min(100,Math.max(0,(lvAvg-(lv.next.at-1))*100)):0}%;transition:width 1s;"></div></div></div>`:'<p style="font-size:17px;opacity:.8;margin-top:6px;">Nivel máximo ⭐</p>'}
      </div>
    </div>
  </div>`;

  let attMsg='';
  if(total>0){
    if(sinDer)attMsg=`<div class="attend-msg attend-blocked"><i class="ti ti-ban"></i> <b>Sin derecho a examen.</b> ${faltas} faltas acumuladas.</div>`;
    else if(faltas===0&&justificantes===0)attMsg=`<div class="attend-msg attend-perfect"><i class="ti ti-star-filled"></i> <b>¡Asistencia perfecta!</b></div>`;
    else if(faltas===0)attMsg=`<div class="attend-msg attend-good"><i class="ti ti-circle-check"></i> Sin faltas injustificadas. ${justificantes} justificante(s).</div>`;
    else if(faltas===1)attMsg=`<div class="attend-msg attend-warn"><i class="ti ti-alert-triangle"></i> <b>1 falta registrada.</b> Cuidado.</div>`;
    else attMsg=`<div class="attend-msg attend-danger"><i class="ti ti-alert-circle"></i> <b>${faltas} faltas.</b> ${MAX_FALTAS-faltas} más y pierdes derecho.</div>`;
  }

  const ptabs=`<div class="parcial-tabs">${PERIODS.map(p=>{const isCur=p.key===config.activePeriod;const isVp=p.key===vp;return`<button class="parcial-tab ${isVp?(isCur?'active-cur':'active'):''}" onclick="setViewingParcial('${p.key}')" style="${isCur&&!isVp?'border-color:rgba(0,255,136,0.3);color:rgba(0,255,136,0.6);':''}">${p.short}${isCur?` <span style="font-size:11px;background:rgba(0,255,136,0.2);color:var(--green);padding:1px 6px;border-radius:20px;vertical-align:middle;">EN CURSO</span>`:''}</button>`;}).join('')}</div>`;

  const critHTML=ruOk?`<div style="display:flex;flex-direction:column;gap:10px;">`+CRITERIA.map(c=>{
    const g=calcCriteriaGrade(mat,c.key,c.freq,vp);
    const pct=g!==null?Math.min(100,(g/10)*100):0;
    const freqLabel=c.freq==='semana'?'Por sesión':c.freq==='actividad'?'Por actividad':' Por parcial';
    const gColor=g===null?'#4a5a7a':g>=9?'#00ff88':g>=7?'#ffaa00':'#ff4444';
    const bgColor=g===null?'rgba(74,90,122,0.08)':g>=9?'rgba(0,255,136,0.07)':g>=7?'rgba(255,170,0,0.07)':'rgba(255,68,68,0.07)';
    const borderColor=g===null?'rgba(74,90,122,0.2)':g>=9?'rgba(0,255,136,0.25)':g>=7?'rgba(255,170,0,0.25)':'rgba(255,68,68,0.25)';
    let sessDetail='';

      // Only show entries from graded submitted codes, numbered 1,2,3...

      }

    if(c.freq==='semana'){

      </div>
    </div>`;
  }).join('')+`</div>`:`<div style="text-align:center;padding:2.5rem;color:var(--text3);"><div style="width:56px;height:56px;border-radius:14px;background:rgba(74,90,122,0.1);border:1px solid rgba(74,90,122,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;"><i class="ti ti-lock" style="font-size:26px;"></i></div><p style="font-size:17px;font-weight:600;color:var(--text2);margin-bottom:6px;">Rúbricas no configuradas</p><p style="font-size:17px;line-height:1.6;">El profesor aún no ha definido la forma de evaluación del curso.</p></div>`;

  const sess=getSessions(vp);

function renderForumHTML(){
  const pqs=questions.filter(q=>q.period===config.activePeriod||!q.period);
  if(!pqs.length)return'<div class="empty-state"><i class="ti ti-message-off"></i><p>Aún no hay preguntas del foro.</p></div>';
  return pqs.map(q=>{const i=questions.indexOf(q);const st=getStatus(q);const rc=countReplies(q.id);const sb=st==='closed'?'<span class="badge badge-red"><i class="ti ti-lock"></i> Cerrado</span>':st==='soon'?`<span class="badge badge-amber"><i class="ti ti-clock"></i> ${timeLeft(q.closesAt)}</span>`:'<span class="badge badge-green"><i class="ti ti-circle-check"></i> Abierto</span>';return`<div class="card card-click question-card fade-up" data-qidx="${i}"><h3>${esc(q.title)}</h3>${q.body?`<p class="preview">${esc(q.body)}</p>`:''}<div class="card-meta">${sb}<span class="badge badge-gray"><i class="ti ti-message"></i> ${rc}</span>${q.week?`<span class="week-tag">Ses ${q.week}</span>`:''}</div></div>`;}).join('');
}
function bindForumEvents(){document.querySelectorAll('[data-qidx]').forEach(el=>el.addEventListener('click',()=>openQuestion(parseInt(el.dataset.qidx))));}

function openQuestion(idx){
  const q=questions[idx];const st=getStatus(q);const closed=st==='closed';
  const qReps=replies[q.id]||[];
  const dash=document.getElementById('stu-dash');
  const authorField=currentStudent?`<input type="text" id="reply-author" value="${esc(firstNames(currentStudent.name))}" readonly style="background:var(--surface2);">`:`<input type="text" id="reply-author" placeholder="Tu nombre">`;
  const timerH=q.closesAt?`<div class="timer-bar timer-${st}"><i class="ti ti-clock"></i>${closed?`Cerrado el ${fmtDate(q.closesAt)}`:`Cierra en ${timeLeft(q.closesAt)}`}</div>`:'';
  dash.innerHTML=`<div class="inner-tabs"><button class="tab" onclick="setStudentTab('foro')"><i class="ti ti-arrow-left"></i> Volver al Foro</button></div>${timerH}<div class="detail-header"><h2>${esc(q.title)}</h2>${q.body?`<p class="body-text">${esc(q.body)}</p>`:''}</div><hr class="divider"><p style="font-size:17px;font-weight:600;color:var(--text2);margin-bottom:1rem;">${qReps.length} respuesta(s)</p><div id="replies-box">${renderReplies(qReps,q.id,closed)}</div>${!closed?`<hr class="divider"><h3 style="font-size:17px;font-weight:600;margin-bottom:1rem;">Tu respuesta</h3><div class="form-group"><label>Nombre</label>${authorField}</div><div class="form-group"><label>Argumento</label><textarea id="reply-text" rows="4" placeholder="Escribe tu postura..."></textarea></div><button class="btn btn-primary" onclick="submitReply('${q.id}',${idx})"><i class="ti ti-send"></i> Publicar</button>`:`<div style="background:var(--red-bg);color:var(--red-text);padding:12px 16px;border-radius:var(--radius);font-size:18px;font-weight:600;"><i class="ti ti-lock"></i> Debate cerrado.</div>`}`;
}

function renderReplies(reps,qid,closed){
  if(!reps.length)return'<p style="font-size:18px;color:var(--text2);margin-bottom:1rem;">Sé el primero en responder.</p>';
  return reps.map((r,ri)=>{
    const nested=(r.replies||[]).map((nr,nri)=>`<div class="nested-reply"><div style="display:flex;justify-content:space-between;"><p class="reply-author"><i class="ti ti-corner-down-right"></i> ${esc(nr.author)}</p>${isTeacher?`<button class="btn btn-danger btn-sm" onclick="deleteNestedReply('${qid}',${ri},${nri})"><i class="ti ti-trash"></i></button>`:''}</div><p class="reply-text">${esc(nr.text)}</p><p class="reply-time">${nr.time}</p></div>`).join('');
    const naa=currentStudent?`value="${esc(firstNames(currentStudent.name))}" readonly style="background:var(--surface2);"`:` placeholder="Tu nombre"`;
    return`<div class="reply-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><p class="reply-author"><i class="ti ti-user"></i> ${esc(r.author)}</p>${isTeacher?`<button class="btn btn-danger btn-sm" onclick="deleteReply('${qid}',${ri})"><i class="ti ti-trash"></i></button>`:''}</div><p class="reply-text">${esc(r.text)}</p><p class="reply-time">${r.time}</p><div class="reply-actions">${!closed?`<button class="btn btn-sm" onclick="toggleReplyForm('${qid}',${ri})"><i class="ti ti-corner-down-right"></i> Responder</button>`:''}</div>${nested?`<div class="nested-replies">${nested}</div>`:''} ${!closed?`<div class="inline-reply-form" id="rf-${qid}-${ri}"><p style="font-size:18px;color:var(--text2);margin-bottom:8px;font-weight:600;">Respondiendo a ${esc(r.author)}</p><input type="text" id="rf-name-${qid}-${ri}" ${naa}><textarea id="rf-text-${qid}-${ri}" rows="3" placeholder="Tu respuesta..."></textarea><div style="display:flex;gap:8px;"><button class="btn btn-primary btn-sm" onclick="submitNestedReply('${qid}',${ri})"><i class="ti ti-send"></i> Enviar</button><button class="btn btn-sm" onclick="toggleReplyForm('${qid}',${ri})">Cancelar</button></div></div>`:''}</div>`;
  }).join('');
}

window.toggleReplyForm=function(qid,ri){const f=document.getElementById(`rf-${qid}-${ri}`);if(f)f.style.display=f.style.display!=='block'?'block':'none';};
window.submitReply=async function(qid,idx){const a=document.getElementById('reply-author')?.value.trim()||'Anónimo';const t=document.getElementById('reply-text')?.value.trim();if(!t){toast('Escribe tu argumento');return;}if(!replies[qid])replies[qid]=[];replies[qid].push({author:a,text:t,time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}),replies:[]});await saveAll();openQuestion(idx);celebrate('🎯','¡Argumento publicado!','Tu voz está en el debate.');};
window.submitNestedReply=async function(qid,ri){const n=document.getElementById(`rf-name-${qid}-${ri}`)?.value.trim()||'Anónimo';const t=document.getElementById(`rf-text-${qid}-${ri}`)?.value.trim();if(!t){toast('Escribe tu respuesta');return;}if(!replies[qid][ri].replies)replies[qid][ri].replies=[];replies[qid][ri].replies.push({author:n,text:t,time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'})});await saveAll();toast('Respuesta enviada');};
window.deleteReply=async function(qid,ri){replies[qid].splice(ri,1);await saveAll();toast('Eliminado');};
window.deleteNestedReply=async function(qid,ri,nri){replies[qid][ri].replies.splice(nri,1);await saveAll();toast('Eliminado');};

function renderMySubmissions(mat){
  const ap=config.activePeriod;
  const allSessOrder=getSessions(ap).map(s=>s.id);const subs=[...(codeSubmissions[ap]||[]).filter(s=>s.mat===mat)].sort((a,b)=>allSessOrder.indexOf(a.sessId)-allSessOrder.indexOf(b.sessId));
  const names=subs.map(s=>(s.projectName||'Sin nombre').trim());
  const dupSet=new Set(names.filter((n,i)=>names.indexOf(n)!==i));
  const dupWarn=dupSet.size?`<div class="attend-msg attend-warn"><i class="ti ti-alert-triangle"></i> <b>Nombres duplicados:</b> ${[...dupSet].map(n=>`"${n}"`).join(', ')}. Considera renombrarlos.</div>`:'';

  return dupWarn+`<div class="panel-title"><i class="ti ti-file-code"></i> Mis Códigos — ${PERIODS.find(p=>p.key===ap)?.short}</div>`+
  subs.slice().reverse().map(s=>{
    const g=s.grade!==null&&s.grade!==undefined;

    return`<div class="card fade-up">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><i class="ti ti-brand-${s.lang==='cpp'?'cpp':'python'}" style="color:${lc};font-size:18px;"></i><span style="font-size:18px;font-weight:700;">${esc(s.projectName||'Sin nombre')}</span></div><div style="font-size:18px;color:var(--text3);">${esc(s.sessLabel)} · ${s.time}</div></div>
        <div style="text-align:right;">${g?`<span style="font-size:22px;font-weight:800;color:${s.grade>=9?'var(--green)':s.grade>=7?'var(--amber)':'var(--red)'};">${s.grade.toFixed(1)}</span>`:'<span style="font-size:17px;color:var(--text3);">Sin calificar</span>'}${s.feedback?`<div style="font-size:18px;color:var(--text2);margin-top:4px;max-width:200px;">${esc(s.feedback)}</div>`:''}</div>
      </div>
      <div class="code-editor-wrap" style="margin-top:12px;">
        <div class="code-editor-header"><div class="editor-dots"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></div><span class="editor-filename">${s.lang==='cpp'?'main.cpp':'script.py'}</span></div>
        <div style="background:#1e1e1e;padding:12px 14px;overflow:auto;max-height:200px;"><pre style="font-family:'Fira Code',monospace;font-size:17px;color:#d4d4d4;margin:0;white-space:pre;">${esc(s.code)}</pre></div>
      </div>
    </div>`;
  }).join('');
}

function clearTerminal(btn){

function speakWelcome(name,isT=false){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  // Normalize name: map known English names to Spanish phonetics
  const englishToSpanish={
    'America':'Amérika','Evany':'Evani','Paola':'Paola','Karla':'Karla',
    'Martha':'Marta','Brandon':'Bréndon','Lesly':'Lesli','Ivan':'Ivan',
    'Angie':'Anyi','America':'Amérika','Naslirani':'Naslírani'
  };
  let firstName=name?name.split(' ').pop():'';
  firstName=firstName.charAt(0).toUpperCase()+firstName.slice(1).toLowerCase();
  const phonetic=englishToSpanish[firstName]||firstName;
  // Always use female voice (same for teacher greeting)
  // Male names in roster: Brandon, Ivan. Teacher = male. All others female.
  const maleNames=new Set(['Brandon','Ivan','Bréndon']);
  const isMale=isT||maleNames.has(firstName)||maleNames.has(phonetic);
  const hora=new Date().getHours();
  const momento=hora<12?'buenos días':hora<19?'buenas tardes':'buenas noches';
  const greet=`Hola, ${isT?'Profe':phonetic}, ${momento}.`;
  const utter=new SpeechSynthesisUtterance(greet);
  utter.lang='es-US';utter.rate=0.95;utter.pitch=1.05;
  const go=()=>{
    const vs=speechSynthesis.getVoices();if(!vs.length)return false;
    // Prefer female Spanish voices
    const femPref=[
      v=>/google.*español.*female|google.*es.*female/i.test(v.name),
      v=>/sabina|lucia|monica|paloma|helena|maria|isabel|paula|carmen/i.test(v.name),
      v=>v.lang==='es-US'&&/female|mujer/i.test(v.name),
      v=>v.lang==='es-MX',
      v=>v.lang==='es-US',
      v=>v.lang.startsWith('es'),
    ];
    for(const t of femPref){const f=vs.find(t);if(f){utter.voice=f;break;}}
    speechSynthesis.speak(utter);return true;
  };
  if(!go())speechSynthesis.onvoiceschanged=function(){speechSynthesis.onvoiceschanged=null;go();};
}

function tkCpp(line){let o='',i=0,L=line.length;while(i<L){if(i<L-1&&line[i]==='/'&&line[i+1]==='/'){o+=`<span class="cm">${hEsc(line.slice(i))}</span>`;break;}if(i===0&&line[0]==='#'){const m=line.match(/^(\s*#\s*\w+)(.*)/);if(m){o+=`<span class="pp">${hEsc(m[1])}</span>`;const r=m[2];const a=r.match(/^(\s*)(<[^>]+>)(.*)/);if(a)o+=hEsc(a[1])+`<span class="st">${hEsc(a[2])}</span>`+tkCpp(a[3]);else{const b=r.match(/^(\s*)("[^"]*")(.*)/);if(b)o+=hEsc(b[1])+`<span class="st">${hEsc(b[2])}</span>`+tkCpp(b[3]);else o+=tkCpp(r);}break;}}if(line[i]==='"'){let j=i+1;while(j<L&&!(line[j]==='"'&&line[j-1]!=='\\'))j++;j++;o+=`<span class="st">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(line[i]==="'"){let j=i+1;while(j<L&&!(line[j]==="'"&&line[j-1]!=='\\'))j++;j++;o+=`<span class="st">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(/[0-9]/.test(line[i])&&(i===0||!/\w/.test(line[i-1]))){let j=i;while(j<L&&/[0-9.xXa-fA-FuUlLeE+\-]/.test(line[j]))j++;o+=`<span class="nm">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(/[a-zA-Z_]/.test(line[i])){let j=i;while(j<L&&/\w/.test(line[j]))j++;const w=line.slice(i,j);let k=j;while(k<L&&line[k]===' ')k++;const isC=line[k]==='(';if(CPP_KW.has(w))o+=`<span class="kw">${hEsc(w)}</span>`;else if(CPP_TY.has(w))o+=`<span class="ty">${hEsc(w)}</span>`;else if(isC)o+=`<span class="fn">${hEsc(w)}</span>`;else if(/^[A-Z]/.test(w))o+=`<span class="ty">${hEsc(w)}</span>`;else o+=`<span class="vr">${hEsc(w)}</span>`;i=j;continue;}if(i<L-1){const t2=line.slice(i,i+2);if(['<<','>>','<=','>=','!=','==','&&','||','++','--','->','::','+=','-=','*=','/=','%='].includes(t2)){o+=`<span class="op">${hEsc(t2)}</span>`;i+=2;continue;}}if(/[+\-*\/=<>!&|^~%?:,;.]/.test(line[i])){o+=`<span class="op">${hEsc(line[i])}</span>`;i++;continue;}if(/[(){}\[\]]/.test(line[i])){o+=`<span class="pt">${hEsc(line[i])}</span>`;i++;continue;}o+=hEsc(line[i]);i++;}return o;}

function hlPy(code){return code.split('\n').map(line=>{if(/^\s*#/.test(line))return`<span class="cm">${hEsc(line)}</span>`;let o='',i=0,L=line.length;while(i<L){if(line[i]==='#'){o+=`<span class="cm">${hEsc(line.slice(i))}</span>`;break;}if(/^[frFR]/.test(line[i])&&i+1<L&&(line[i+1]==='"'||line[i+1]==="'")){const q=line[i+1];let j=i+2;while(j<L&&line[j]!==q)j++;j++;o+=`<span class="st">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(line[i]==='"'||line[i]==="'"){const q=line[i];let j=i+1;while(j<L&&!(line[j]===q&&line[j-1]!=='\\'))j++;j++;o+=`<span class="st">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(/[0-9]/.test(line[i])&&(i===0||!/\w/.test(line[i-1]))){let j=i;while(j<L&&/[0-9.eExX_jJ]/.test(line[j]))j++;o+=`<span class="nm">${hEsc(line.slice(i,j))}</span>`;i=j;continue;}if(/[a-zA-Z_]/.test(line[i])){let j=i;while(j<L&&/\w/.test(line[j]))j++;const w=line.slice(i,j);let k=j;while(k<L&&line[k]===' ')k++;const isC=line[k]==='(';if(PY_KW.has(w))o+=`<span class="kw">${hEsc(w)}</span>`;else if(PY_CN.has(w))o+=`<span class="nm">${hEsc(w)}</span>`;else if(PY_BI.has(w))o+=`<span class="ty">${hEsc(w)}</span>`;else if(isC)o+=`<span class="fn">${hEsc(w)}</span>`;else if(/^[A-Z]/.test(w))o+=`<span class="ty">${hEsc(w)}</span>`;else o+=`<span class="vr">${hEsc(w)}</span>`;i=j;continue;}if(i<L-1){const t2=line.slice(i,i+2);if(['**','//','<=','>=','!=','==','+=','-=','*=','/=','%=','->',':='].includes(t2)){o+=`<span class="op">${hEsc(t2)}</span>`;i+=2;continue;}}if(/[+\-*\/=<>!&|^~%?:,;.]/.test(line[i])){o+=`<span class="op">${hEsc(line[i])}</span>`;i++;continue;}if(/[(){}\[\]]/.test(line[i])){o+=`<span class="pt">${hEsc(line[i])}</span>`;i++;continue;}o+=hEsc(line[i]);i++;}return o;}).join('\n');}

function splitArgs(s){if(!s?.trim())return[];const a=[];let d=0,c='',inS=false,sq='';for(let i=0;i<s.length;i++){const ch=s[i];if(!inS&&(ch==='"'||ch==="'")){inS=true;sq=ch;c+=ch;continue;}if(inS&&ch===sq&&s[i-1]!=='\\'){inS=false;c+=ch;continue;}if(inS){c+=ch;continue;}if(ch==='('||ch==='['||ch==='{')d++;if(ch===')'||ch===']'||ch==='}')d--;if(ch===','&&d===0){a.push(c.trim());c='';}else c+=ch;}if(c.trim())a.push(c.trim());return a;}

  // ── Highlight & line-numbers sync (NO scrollTop here — only in scroll listener) ──
  function doHL(){
    const code=ta.value;
    hl.innerHTML=HL(code);
    const lineCount=code.split('\n').length;
    lnEl.textContent=Array.from({length:lineCount},(_,i)=>i+1).join('\n');
  }

  function syncScroll(){
    hl.scrollTop=ta.scrollTop;
    hl.scrollLeft=ta.scrollLeft;
    lnEl.scrollTop=ta.scrollTop;
  }

  function updCur(){
    const pos=ta.selectionStart;
    const bef=ta.value.substring(0,pos);
    const ln=bef.split('\n').length;
    const col=bef.split('\n').pop().length+1;
    if(cur) cur.textContent=`Ln ${ln}, Col ${col}`;
  }

  function autoSave(){
    clearTimeout(asT);
    if(asEl){asEl.textContent='● guardando...';asEl.style.color='#ffaa44';}
    asT=setTimeout(()=>{
      try{
        localStorage.setItem(lsKey('bk'),ta.value);
        localStorage.setItem(lsKey('nm'),pnEl?.value||'');
      }catch(e){}
      if(asEl){asEl.textContent='● guardado';asEl.style.color='#00ff88';}
    },1500);
  }

  ta.value=savedCode;
  doHL();

  ta.addEventListener('input',()=>{doHL();autoSave();});
  ta.addEventListener('scroll',syncScroll);
  ta.addEventListener('click',updCur);
  ta.addEventListener('keyup',updCur);
  if(pnEl) pnEl.addEventListener('input',autoSave);

  // ── Keyboard shortcuts ──
  ta.addEventListener('keydown',e=>{
    const s=ta.selectionStart,en=ta.selectionEnd,val=ta.value;
    const bef=val.substring(0,s),aft=val.substring(en);
    const curLine=bef.split('\n').pop();
    const indent=curLine.match(/^(\s*)/)[1];

    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){
      e.preventDefault();
      document.getElementById('run-'+mountId)?.click();
      return;
    }
    if(e.ctrlKey&&e.shiftKey&&e.key==='C'){
      e.preventDefault();
      navigator.clipboard?.writeText(ta.value).then(()=>toast('Código copiado'));
      return;
    }
    if(e.key==='Tab'){
      e.preventDefault();
      if(en>s){
        const lines=val.substring(s,en).split('\n').map(l=>'  '+l).join('\n');
        ta.value=val.substring(0,s)+lines+val.substring(en);
        ta.selectionStart=s; ta.selectionEnd=s+lines.length;
      } else {
        ta.value=bef+'  '+aft;
        ta.selectionStart=ta.selectionEnd=s+2;
      }
      doHL();autoSave();return;
    }
    if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){
      e.preventDefault();
      const trimmed=curLine.trimEnd();
      const extraIndent=(isCpp?trimmed.endsWith('{'):trimmed.endsWith(':'))?'  ':'';
      const ins='\n'+indent+extraIndent;
      ta.value=bef+ins+aft;
      ta.selectionStart=ta.selectionEnd=s+ins.length;
      doHL();autoSave();return;
    }
    if(e.key==='Backspace'&&s===en&&s>0){
      const pairs={'(':')','{':'}','[':']','"':'"',"'":"'"};
      if(pairs[val[s-1]]===val[s]){
        e.preventDefault();
        ta.value=val.substring(0,s-1)+val.substring(s+1);
        ta.selectionStart=ta.selectionEnd=s-1;
        doHL();autoSave();return;
      }
    }
    const closers={'(':')','{':'}','[':']'};
    if(closers[e.key]){
      e.preventDefault();
      ta.value=bef+e.key+closers[e.key]+aft;
      ta.selectionStart=ta.selectionEnd=s+1;
      doHL();autoSave();return;
    }
    if(e.key==='"'||e.key==="'"){
      if(val[s]===e.key&&val[s-1]!==e.key){e.preventDefault();ta.selectionStart=ta.selectionEnd=s+1;return;}
      e.preventDefault();
      ta.value=bef+e.key+e.key+aft;
      ta.selectionStart=ta.selectionEnd=s+1;
      doHL();autoSave();return;
    }
    if([')',']','}'].includes(e.key)&&val[s]===e.key){
      e.preventDefault();
      ta.selectionStart=ta.selectionEnd=s+1;
      return;
    }
  });

  // ── Example chips ──
  mount.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      ta.value=EX[chip.dataset.key]||'';
      doHL();ta.focus();autoSave();
    });
  });

  // ── Run ──
  document.getElementById('run-'+mountId).addEventListener('click',()=>{
    term.innerHTML='<div class="tl t-info">// '+(isCpp?'Compilando...':'Ejecutando...')+'</div>';
    setTimeout(()=>isCpp?runCpp(ta.value,term):runPy(ta.value,term),80);
  });

  // ── Clear ──
  document.getElementById('clr-'+mountId).addEventListener('click',()=>{
    ta.value='';doHL();
    term.innerHTML='<div class="tl"><span class="tcursor"></span></div>';
    autoSave();
  });

  // ── Format ──
  document.getElementById('fmt-'+mountId).addEventListener('click',()=>{
    ta.value=isCpp?fmtCpp(ta.value):fmtPy(ta.value);
    doHL();toast('Código formateado');autoSave();
  });

  // ── Copy ──
  document.getElementById('btn-copy-'+mountId).addEventListener('click',()=>{
    navigator.clipboard?.writeText(ta.value)
      .then(()=>toast('Código copiado'))
      .catch(()=>{const t=document.createElement('textarea');t.value=ta.value;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);toast('Código copiado');});
  });

  // ── Backup ──
  document.getElementById('btn-bk-'+mountId).addEventListener('click',()=>{
    const bk=localStorage.getItem(lsKey('bk'));
    if(!bk){toast('Sin autoguardado disponible');return;}
    if(ta.value===bk){toast('Ya tienes la versión guardada');return;}
    ta.value=bk;doHL();toast('Backup restaurado');
  });

  // ── Submit ──
  document.getElementById('btn-sub-'+mountId).addEventListener('click',()=>{
    const code=ta.value.trim();
    if(!code){toast('Escribe código antes de enviar');return;}
    if(!currentStudent){toast('Inicia sesión primero');return;}
    const ap=config.activePeriod;
    const sess=getSessions(ap);
    if(!sess.length){toast('El profesor aún no ha creado sesiones');return;}
    const activeSess=config.activeSession
      ?sess.find(s=>s.id===config.activeSession)||sess[sess.length-1]
      :sess[sess.length-1];
    const name=pnEl?.value.trim()||'Sin nombre';
    const sub={
      mat:currentStudent.mat,
      name:currentStudent.name,
      projectName:name,
      lang,
      code,
      time:new Date().toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'}),
      sessId:activeSess.id,
      sessLabel:activeSess.label,
      grade:null,
      feedback:''
    };
    if(!codeSubmissions[ap])codeSubmissions[ap]=[];
    // Always append — never overwrite
    codeSubmissions[ap].push(sub);
    saveAll().then(()=>{
      toast('Enviado: "'+name+'" → '+activeSess.label);
      celebrate('📤','¡Código enviado!','Tu proyecto "'+name+'" fue enviado a '+activeSess.label);
    });
  });

  // ── Color + character reference ──
  const colorRef=document.createElement('div');
  colorRef.className='card fade-up';
  colorRef.style.marginBottom='.75rem';
  const syntaxColors=isCpp?[
    ['#569cd6','Palabras reservadas: int, float, return, if, for, while'],
    ['#4ec9b0','Tipos y clases: string, vector, cout, cin, endl'],
    ['#dcdcaa','Funciones: main(), sqrt(), miFunc()'],
    ['#ce9178','Cadenas de texto: "Hola Mundo"'],
    ['#b5cea8','Números: 42, 3.14, true, false, nullptr'],
    ['#6a9955','Comentarios: // línea   /* bloque */'],
    ['#c586c0','Directivas: #include, #define'],
    ['#9cdcfe','Variables y parámetros propios'],
  ]:[
    ['#569cd6','Palabras clave: def, if, elif, for, while, class, return'],
    ['#4ec9b0','Built-ins: print, len, range, input, type'],
    ['#dcdcaa','Funciones definidas: miFunc(), calcular()'],
    ['#ce9178','Cadenas: "texto", f"hola {var}"'],
    ['#b5cea8','Números: 42, 3.14, True, False, None'],
    ['#6a9955','Comentarios: # comentario'],
    ['#c586c0','Operadores: and, or, not, in, is'],
    ['#9cdcfe','Variables propias'],
  ];
  const charGuide=isCpp?[
    ['{  }','Bloque de código — agrupa sentencias'],
    ['(  )','Argumentos de función, condiciones'],
    ['[  ]','Acceso a arrays: nums[0]'],
    ['<<','Salida: cout << "texto"'],
    ['>>','Entrada: cin >> variable'],
    ['::','Ámbito: std::cout'],
    ['//','Comentario de una línea'],
    [';','Fin de sentencia — obligatorio'],
    ['->','Miembro de puntero'],
    ['&','Referencia o AND bit a bit'],
  ]:[
    [':','Inicio de bloque (después de if, for, def)'],
    ['    ','4 espacios — define el bloque'],
    ['(  )','Argumentos de función'],
    ['[  ]','Listas: nums[0]'],
    ['{  }','Diccionarios: {clave: valor}'],
    ['f"..."','f-string: interpola variables'],
    ['#','Comentario'],
    ['**','Potencia: 2**8 = 256'],
    ['//','División entera: 7//2 = 3'],
    ['%','Módulo: 10%3 = 1'],
  ];
  colorRef.innerHTML=`
    <div class="panel-title"><i class="ti ti-palette"></i> Referencia de colores — ${isCpp?'C++':'Python'}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:7px;margin-bottom:16px;">
      ${syntaxColors.map(([c,desc])=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(255,255,255,0.02);border-radius:7px;border-left:3px solid ${c};"><span style="width:11px;height:11px;border-radius:50%;background:${c};box-shadow:0 0 7px ${c}99;flex-shrink:0;"></span><span style="font-size:14px;color:var(--text2);line-height:1.4;">${desc}</span></div>`).join('')}
    </div>
    <div class="panel-title" style="margin-bottom:10px;"><i class="ti ti-code"></i> Caracteres especiales y su uso</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px;">
      ${charGuide.map(([ch,desc])=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(255,255,255,0.02);border-radius:7px;"><code style="font-family:'Fira Code',monospace;font-size:14px;color:var(--accent);background:rgba(0,180,255,0.1);padding:2px 8px;border-radius:5px;white-space:nowrap;min-width:52px;text-align:center;">${ch}</code><span style="font-size:14px;color:var(--text2);line-height:1.4;">${desc}</span></div>`).join('')}

// ─── C++ Runtime ───
function runCpp(code,term){
  term.innerHTML='';
  const ob=(code.match(/{/g)||[]).length,cb=(code.match(/}/g)||[]).length;
  if(ob!==cb){tErr(term,`Llaves desbalanceadas: faltan ${ob-cb} }`);tAppend(term,'<div class="tl t-err">compilation terminated [exit 1]</div>');return;}
  if(!code.includes('main')){tErr(term,"función 'main' no encontrada");return;}
  tAppend(term,'<div class="tl t-info">// g++ -std=c++17 ... OK</div>');
  const clean=code.replace(/\/\/[^\n]*/g,'').replace(/\/\*[\s\S]*?\*\//g,'');
  const fnDefs=parseCppFns(clean);
  const mainM=clean.match(/int\s+main\s*\([^)]*\)\s*\{([\s\S]*)$/);
  if(!mainM){tErr(term,"main no encontrado");return;}
  execCpp(flatCpp(mainM[1].replace(/\}\s*$/,'')),{},fnDefs,term,()=>{tAppend(term,'<div class="tl t-success">// exit code 0</div>');tAppend(term,'<div class="tl"><span class="tcursor"></span></div>');});
}
function parseCppFns(code){const fns={};const re=/(\w+)\s+(\w+)\s*\(([^)]*)\)\s*\{/g;let m;while((m=re.exec(code))!==null){if(m[2]==='main')continue;let d=1,j=re.lastIndex;while(j<code.length&&d>0){if(code[j]==='{')d++;else if(code[j]==='}')d--;j++;}fns[m[2]]={params:m[3].split(',').map(p=>p.trim()).filter(Boolean),body:flatCpp(code.slice(re.lastIndex,j-1))};}return fns;}
function flatCpp(raw){
  const lines=[];
  for(let l of raw.split('\n')){
    l=l.trim();
    if(!l)continue;
    // Split "} else if(...){" and "} else {" into separate logical lines
    if(l.match(/^\}\s*else\s+if/)){lines.push('}');lines.push(l.replace(/^\}\s*/,''));}
    else if(l.match(/^\}\s*else\s*\{/)){lines.push('}');lines.push('else{');}
    else if(l.match(/^\}\s*else\s*$/)){lines.push('}');lines.push('else');}
    else if(l!=='{')lines.push(l);
  }
  return lines;
}
function execCpp(lines,env,fnDefs,term,done){
  let i=0;
  function next(){
    if(i>=lines.length){done();return;}
    const line=lines[i++].trim();
    if(!line||line==='{'||line==='}'||line.startsWith('//'))return next();
    if(line.startsWith('return')){env.__return=evalC(line.replace(/^return\s*/,'').replace(/;$/,''),env,fnDefs);return done();}
    if(line==='break'){env.__break=true;return done();}
    if(line==='continue'){env.__cont=true;return done();}
    const declM=line.match(/^(?:int|float|double|long|short|unsigned|char|bool|string|auto)(?:\s+const)?\s+(.+);$/);
    if(declM){splitArgs(declM[1]).forEach(v=>{const arrM=v.match(/^(\w+)\[\d*\]\s*=\s*\{([^}]*)\}$/);const eqM=v.match(/^(\w+)\s*=\s*(.+)$/);const nm=v.match(/^(\w+)/);if(arrM)env[arrM[1]]=arrM[2].split(',').map(x=>evalC(x.trim(),env,fnDefs));else if(eqM)env[eqM[1]]=evalC(eqM[2],env,fnDefs);else if(nm)env[nm[1]]=0;});return next();}
    const asgM=line.match(/^(\w+(?:\[.+?\])?)\s*([+\-*\/%]?=)\s*(.+);$/);
    if(asgM&&!['if','while','for','cout','cin'].some(k=>line.startsWith(k))){const[,lhs,op,rhs]=asgM;const idxM=lhs.match(/^(\w+)\[(.+)\]$/);const rv=evalC(rhs,env,fnDefs);if(idxM){if(!Array.isArray(env[idxM[1]]))env[idxM[1]]=[];env[idxM[1]][evalC(idxM[2],env,fnDefs)]=applyOp(env[idxM[1]][evalC(idxM[2],env,fnDefs)]??0,op,rv);}else env[lhs]=applyOp(env[lhs]??0,op,rv);return next();}
    if(/^(\w+)\+\+;?$/.test(line)||/^\+\+(\w+);?$/.test(line)){const v=(line.match(/\w+/)||[])[0];if(v)env[v]=Number(env[v]||0)+1;return next();}
    if(/^(\w+)--;?$/.test(line)||/^--(\w+);?$/.test(line)){const v=(line.match(/\w+/)||[])[0];if(v)env[v]=Number(env[v]||0)-1;return next();}
    if(line.startsWith('cout')){
      const raw=line.replace(/^cout\s*<<\s*/,'').replace(/;$/,'');
      const parts=splitCout(raw);let out='';
      for(const p of parts){
        const pt=p.trim();
        if(pt==='endl'){tAppend(term,`<div class="tl t-out">${hEsc(out)}</div>`);out='';continue;}
        if(pt==='"\\n"'||pt==="'\\n'"){tAppend(term,`<div class="tl t-out">${hEsc(out)}</div>`);out='';continue;}
        if(pt.startsWith('"')&&pt.endsWith('"')){
          // Handle \n and \t inside strings

          const str=pt.slice(1,-1);
          const parts2=str.split('\\n');
          for(let pi=0;pi<parts2.length;pi++){
            out+=parts2[pi].replace(/\\t/g,'    ');
            if(pi<parts2.length-1){tAppend(term,`<div class="tl t-out">${hEsc(out)}</div>`);out='';}
          }
          continue;
        }
        if(pt.startsWith("'")&&pt.endsWith("'")){
          const ch=pt.slice(1,-1);
          if(ch==='\\n'){tAppend(term,`<div class="tl t-out">${hEsc(out)}</div>`);out='';continue;}
          out+=ch==='\\t'?'    ':ch[0]||'';continue;
        }
        const v=evalC(pt,env,fnDefs);
        if(typeof v==='number'&&!Number.isInteger(v)){out+=parseFloat(v.toFixed(8)).toString();}
        else out+=typeof v==='string'?v:String(v);
      }
      if(out)tAppend(term,`<div class="tl t-out">${hEsc(out)}</div>`);
      return next();
    }
    if(line.startsWith('cin')){const vars=line.replace(/^cin\s*/,'').replace(/;$/,'').split('>>').map(v=>v.trim()).filter(v=>v&&v!=='cin');if(!vars.length)return next();function askCin(vi){if(vi>=vars.length)return next();tInput(term,'',val=>{env[vars[vi]]=isNaN(val)||val===''?val:Number(val);askCin(vi+1);});}askCin(0);return;}
    if(line.startsWith('if')||line.startsWith('else')){
      const blk=collectBlock(lines,i);i=blk.ni;
      const condM=line.match(/^(?:else\s+)?if\s*\((.+)\)/);
      const mainCond=condM?evalCondC(condM[1],env,fnDefs):true;
      if(mainCond){
        execCpp(blk.body,{...env},fnDefs,term,()=>{Object.assign(env,{});next();});
      } else {
        // Try else-if/else chain in order
        let ran=false;
        function tryChain(ci){
          if(ci>=blk.elseChain.length){if(!ran)next();return;}
          const branch=blk.elseChain[ci];
          const ok=branch.cond?evalCondC(branch.cond,env,fnDefs):true;
          if(ok){ran=true;execCpp(branch.body,{...env},fnDefs,term,()=>next());}
          else tryChain(ci+1);
        }
        tryChain(0);
      }
      return;
    }
    if(line.startsWith('for')){const forM=line.match(/^for\s*\(\s*(?:(?:int|float|double|auto)\s+)?(\w+)\s*=\s*([^;]+);\s*([^;]+);\s*(.+)\)/);const blk=collectBlock(lines,i);i=blk.ni;if(!forM)return next();const[,vn,initE,condE,incE]=forM;env[vn]=evalC(initE.trim(),env,fnDefs);let it=0;function fLoop(){it++;if(it>1000){tErr(term,'Límite de iteraciones');return next();}if(!evalCondC(condE.trim(),env,fnDefs))return next();const fe={...env};execCpp([...blk.body],fe,fnDefs,term,()=>{if(fe.__break)return next();Object.assign(env,fe);delete env.__break;delete env.__cont;const inc=incE.trim();if(inc.endsWith('++'))env[vn]=Number(env[vn]||0)+1;else if(inc.endsWith('--'))env[vn]=Number(env[vn]||0)-1;else{const am=inc.match(/(\w+)\s*([+\-*\/]?=)\s*(.+)/);if(am)env[am[1]]=applyOp(env[am[1]]||0,am[2],evalC(am[3],env,fnDefs));}fLoop();});}fLoop();return;}
    if(line.startsWith('while')){const wM=line.match(/^while\s*\((.+)\)/);const blk=collectBlock(lines,i);i=blk.ni;let wi=0;function wLoop(){wi++;if(wi>1000){tErr(term,'Límite de iteraciones');return next();}if(!evalCondC(wM?wM[1]:'false',env,fnDefs))return next();const we={...env};execCpp([...blk.body],we,fnDefs,term,()=>{if(we.__break)return next();Object.assign(env,we);delete env.__break;delete env.__cont;wLoop();});}wLoop();return;}
    if(line.startsWith('do')){const blk=collectBlock(lines,i);i=blk.ni;const wl=lines[i]?.trim()||'';const wM=wl.match(/^while\s*\((.+)\);?$/);if(wM)i++;let di=0;function dLoop(){di++;if(di>1000){tErr(term,'Límite de iteraciones');return next();}const de={...env};execCpp([...blk.body],de,fnDefs,term,()=>{Object.assign(env,de);if(de.__break||!evalCondC(wM?wM[1]:'false',env,fnDefs))return next();dLoop();});}dLoop();return;}
    if(line.startsWith('switch')){const swM=line.match(/^switch\s*\((.+)\)/);const val=swM?evalC(swM[1],env,fnDefs):0;const blk=collectBlock(lines,i);i=blk.ni;const cases=[];let ci=0;while(ci<blk.body.length){const cl=blk.body[ci].trim();const cm=cl.match(/^case\s+(.+):$/);const dm=cl==='default:';if(cm||dm){const cv=cm?evalC(cm[1],env,fnDefs):'__def__';const body=[];ci++;while(ci<blk.body.length&&!blk.body[ci].trim().match(/^case\s+|^default:/)){body.push(blk.body[ci]);ci++;}cases.push({val:cv,body});}else ci++;}let matched=false,broken=false;function runSw(bi){if(bi>=cases.length||broken)return next();const cb=cases[bi];if(!matched&&(cb.val===val||cb.val==='__def__'))matched=true;if(!matched)return runSw(bi+1);execCpp([...cb.body],env,fnDefs,term,()=>{if(env.__break){broken=true;delete env.__break;}runSw(bi+1);});}runSw(0);return;}
    next();
  }
  next();
}
function collectBlock(lines,startIdx){
  const body=[],elseChain=[];
  let i=startIdx;
  if(lines[i]?.trim()==='{')i++;
  let d=1;
  while(i<lines.length&&d>0){const l=lines[i].trim();if(l==='}')d--;if(d===0)break;if(l==='{')d++;body.push(lines[i]);i++;}
  if(lines[i]?.trim()==='}')i++;
  // Consume ENTIRE else-if/else chain
  while(i<lines.length){
    const el=lines[i]?.trim()||'';
    if(!el.startsWith('else'))break;
    i++;
    const condM=el.match(/^else\s+if\s*\((.+)\)/);
    const cond=condM?condM[1]:null;
    if(lines[i]?.trim()==='{')i++;
    const branchBody=[];
    let d2=1;
    while(i<lines.length&&d2>0){const l=lines[i].trim();if(l==='}')d2--;if(d2===0)break;if(l==='{')d2++;branchBody.push(lines[i]);i++;}
    if(lines[i]?.trim()==='}')i++;
    elseChain.push({cond,body:branchBody});
    if(!cond)break; // plain else is last
  }
  return{body,elseChain,ni:i};

      <button class="btn btn-danger" onclick="clearAllData()"><i class="ti ti-trash"></i> Borrar todos los datos del grupo</button>
    </div>`;
  }

  panel.innerHTML=tabsHTML+content;
  // Wire up existing rubric weight inputs to counter
  if(teacherTab==='config'){
    setTimeout(()=>{
      document.querySelectorAll('[id^="rc-weight-"]').forEach(el=>el.addEventListener('input',window.updatePctCounter));
      window.updatePctCounter();
    },0);
  }
}
