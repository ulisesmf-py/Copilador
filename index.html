window.cycleAttend=async function(ap,sessId,mat){
  if(!attendance[ap])attendance[ap]={};if(!attendance[ap][sessId])attendance[ap][sessId]={};
  const cur=attendance[ap][sessId][mat]||'';
  const next={'':'P','P':'F','F':'J','J':''};
  const nv=next[cur]||'';
  attendance[ap][sessId][mat]=nv;
  const btn=document.getElementById('att-'+sessId);
  if(btn){btn.textContent=nv||'—';btn.className='attend-btn '+(nv||'');}
  await saveAll();
};

window.flushStudent=async function(){
  const student=ROSTER[teacherStudentIdx];const ap=config.activePeriod;const sess=getSessions(ap);
  if(!grades[student.mat])grades[student.mat]={};if(!grades[student.mat][ap])grades[student.mat][ap]={};
  for(const c of CRITERIA){
    if(c.freq==='actividad')continue;
    if(c.freq==='semana'){
      if(!grades[student.mat][ap][c.key]||typeof grades[student.mat][ap][c.key]!=='object')grades[student.mat][ap][c.key]={};
      for(const s of sess){const el=document.getElementById('gi_'+c.key+'_'+s.id);if(el&&el.value!==''){const v=parseFloat(el.value);if(!isNaN(v))grades[student.mat][ap][c.key][s.id]=Math.min(10,Math.max(0,v));}}
    } else {
      const el=document.getElementById('gi_'+c.key);if(el&&el.value!==''){const v=parseFloat(el.value);if(!isNaN(v))grades[student.mat][ap][c.key]=Math.min(10,Math.max(0,v));}
    }
  }
  await saveAll();toast('Calificaciones guardadas');
};

window.deleteSubmission=async function(ap,idx){
  if(!confirm('¿Eliminar este código enviado? Esta acción libera el espacio en la sesión para el próximo envío.'))return;
  if(!codeSubmissions[ap]||!codeSubmissions[ap][idx]){toast('No encontrado');return;}
  const sub=codeSubmissions[ap][idx];
  const mat=sub.mat;const sessId=sub.sessId;
  // If was graded with actividad criteria, clear that grade slot so next submission fills it
  const actCrit=CRITERIA.filter(c=>c.freq==='actividad');
  if(actCrit.length&&mat&&sub.grade!==null&&sub.grade!==undefined){
    actCrit.forEach(c=>{
      if(grades[mat]?.[ap]?.[c.key]?.[sessId]!==undefined){
        delete grades[mat][ap][c.key][sessId];
      }
    });
  }
  codeSubmissions[ap].splice(idx,1);
  await saveAll();
  toast('Código eliminado — espacio liberado en sesión '+sessId);
  renderTeacherPanel();
};

window.gradeSubmission=async function(ap,idx){
  const g=parseFloat(document.getElementById('sg-'+ap+'-'+idx)?.value);
  const fb=document.getElementById('sf-'+ap+'-'+idx)?.value.trim()||'';
  if(isNaN(g)||g<0||g>10){toast('Calificación debe ser entre 0 y 10');return;}
  if(!codeSubmissions[ap]||!codeSubmissions[ap][idx]){toast('Código no encontrado');return;}
  const sub=codeSubmissions[ap][idx];sub.grade=g;sub.feedback=fb;
  const mat=sub.mat;const sessId=sub.sessId;
  // Determine target session: use config.activeSession if set,
  // otherwise find the first session (by calendar order) without a grade for this student
  let targetSessId=config.activeSession||null;
  if(!targetSessId){
    // Find first session in order that has no grade yet for actividad criteria
    const actKey=CRITERIA.filter(c=>c.freq==='actividad')[0]?.key;
    if(actKey){
      const existingGrades=grades[mat]?.[ap]?.[actKey]||{};
      const orderedSessions=getSessions(ap);
      const firstEmpty=orderedSessions.find(s=>existingGrades[s.id]===undefined||existingGrades[s.id]===null);
      targetSessId=firstEmpty?.id||sessId;
    } else {
      targetSessId=sessId;
    }
  }
  const actCrit=CRITERIA.filter(c=>c.freq==='actividad');
  if(actCrit.length&&mat){
    if(!grades[mat])grades[mat]={};if(!grades[mat][ap])grades[mat][ap]={};
    actCrit.forEach(c=>{
      if(!grades[mat][ap][c.key]||typeof grades[mat][ap][c.key]!=='object')grades[mat][ap][c.key]={};
      // Average all submissions for this student in this session
      const sessSubs=(codeSubmissions[ap]||[]).filter(s=>s.mat===mat&&s.sessId===sessId&&s.grade!==null&&s.grade!==undefined);
      const allG=[...sessSubs.filter(s=>s!==sub).map(s=>Number(s.grade)),g];
      const avg=parseFloat((allG.reduce((a,b)=>a+b,0)/allG.length).toFixed(2));
      grades[mat][ap][c.key][targetSessId]=avg;
    });
  }
  await saveAll();
  const syncMsg=actCrit.length?' · Ponderación actualizada automáticamente':'';
  toast(`Calificado: ${g.toFixed(1)}/10 — ${firstNames(sub.name)}${syncMsg}`);
  renderTeacherPanel();
};

window.addQuestion=async function(){
  const title=document.getElementById('q-title')?.value.trim();if(!title){toast('Escribe un título');return;}
  const body=document.getElementById('q-body')?.value.trim()||'';
  const hours=parseFloat(document.getElementById('q-hours')?.value)||24;
  questions.push({id:'q'+Date.now(),title,body,period:config.activePeriod,closesAt:Date.now()+hours*3600000,createdAt:Date.now()});
  await saveAll();renderTeacherPanel();toast('Pregunta agregada');
};
window.deleteQuestion=async function(idx){if(!confirm('¿Eliminar esta pregunta?'))return;questions.splice(idx,1);await saveAll();renderTeacherPanel();toast('Eliminada');};
window.reopenQuestion=async function(idx){const q=questions[idx];if(!q)return;q.closesAt=Date.now()+24*3600000;await saveAll();renderTeacherPanel();toast('Reabierta por 24h');};

window.saveConfig=async function(){
  config.activePeriod=document.getElementById('cfg-active')?.value;
  config.activeSession=document.getElementById('cfg-active-session')?.value||null;
  config.periods={p1:{start:document.getElementById('cfg-p1-start')?.value||'',end:document.getElementById('cfg-p1-end')?.value||''},p2:{start:document.getElementById('cfg-p2-start')?.value||'',end:document.getElementById('cfg-p2-end')?.value||''},pf:{start:document.getElementById('cfg-pf-start')?.value||'',end:document.getElementById('cfg-pf-end')?.value||''}};
  config.weekdays=[0,1,2,3,4,5,6].filter(d=>document.getElementById('wd-'+d)?.checked);
  config.activitiesPerWeek=parseInt(document.getElementById('cfg-acts')?.value)||1;
  await saveAll();
  updateTopbar();
  renderTeacherPanel();
  // If a student is logged in, update their view to reflect new active period
  if(currentStudent){
    viewingParcial=config.activePeriod;
    document.getElementById('stu-bar-name').textContent=firstNames(currentStudent.name)+' · '+getLevel(calcGlobalGrade(currentStudent.mat)).badge+' '+getLevel(calcGlobalGrade(currentStudent.mat)).name;
  }
  toast('✓ Configuración guardada — Parcial activo: '+PERIODS.find(p=>p.key===config.activePeriod)?.label);
};

window.applyAutoSessions=async function(){
  const ap=config.activePeriod;const p=config.periods?.[ap];
  if(!p?.start||!p?.end){toast('Configura fechas de inicio y fin del parcial');return;}
  const wdays=config.weekdays||[1,3];
  const start=new Date(p.start+'T12:00:00'),end=new Date(p.end+'T12:00:00');
  const dayN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],monN=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const result=[];let cur=new Date(start),n=1;
  while(cur<=end&&result.length<60){if(wdays.includes(cur.getDay())){result.push({id:'s'+cur.getTime(),label:`Ses ${n} · ${dayN[cur.getDay()]} ${cur.getDate()} ${monN[cur.getMonth()]}`,date:cur.toISOString().split('T')[0]});n++;}cur.setDate(cur.getDate()+1);}
  if(!result.length){toast('Sin sesiones para esas fechas y días');return;}
  if(!confirm(`Se generarán ${result.length} sesiones. ¿Continuar?`))return;
  sessions[ap]=result;await saveAll();renderTeacherPanel();toast(`${result.length} sesiones generadas`);
};

window.updatePctCounter=function(){
  const rows=document.querySelectorAll('.rubric-row');
  let total=0;
  rows.forEach(row=>{
    const w=parseFloat(row.querySelector('[id^="rc-weight-"]')?.value)||0;
    total+=w;
  });
  const disp=document.getElementById('pct-display');
  const bar=document.getElementById('pct-bar');
  const isOk=Math.abs(total-100)<1;
  const isOver=total>100;
  if(disp){
    disp.textContent=total+'%';
    disp.style.color=isOk?'var(--green)':isOver?'var(--red)':'var(--amber)';
  }
  if(bar){
    bar.style.width=Math.min(total,100)+'%';
    bar.style.background=isOk?'var(--green)':isOver?'var(--red)':'var(--amber)';
    bar.style.boxShadow=isOk?'0 0 8px rgba(0,255,136,0.5)':isOver?'0 0 8px rgba(255,68,68,0.5)':'0 0 8px rgba(255,170,0,0.5)';
  }
};

window.addRubricRow=function(){
  const container=document.getElementById('rubric-rows');if(!container)return;
  const i=container.children.length;
  const row=document.createElement('div');row.className='rubric-row';row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px;';
  row.innerHTML=`<input type="text" id="rc-label-${i}" placeholder="Nombre del criterio" style="flex:2;min-width:130px;"><input type="number" id="rc-weight-${i}" min="1" max="100" placeholder="%" style="flex:0 0 64px;"><select id="rc-freq-${i}" style="flex:1;min-width:120px;"><option value="parcial">Por parcial</option><option value="semana">Por sesión</option><option value="actividad">Por actividad (código)</option></select><button class="btn btn-danger btn-sm" onclick="this.closest('.rubric-row').remove()"><i class="ti ti-trash"></i></button>`;
  container.appendChild(row);
  // Wire up weight input to live counter
  row.querySelector('[id^="rc-weight-"]').addEventListener('input',window.updatePctCounter);
  window.updatePctCounter();
};

window.saveRubrics=async function(){
  const rows=document.querySelectorAll('.rubric-row');const newCrit=[];let totalW=0;
  rows.forEach((row,i)=>{const label=row.querySelector(`[id^="rc-label-"]`)?.value.trim();const weight=parseFloat(row.querySelector(`[id^="rc-weight-"]`)?.value)||0;const freq=row.querySelector(`[id^="rc-freq-"]`)?.value||'parcial';if(!label||weight<=0)return;newCrit.push({key:'c'+i,label,weight,icon:'ti-star',freq});totalW+=weight;});
  if(!newCrit.length){toast('Agrega al menos un criterio');return;}
  if(Math.abs(totalW-100)>1){toast(`Los porcentajes deben sumar 100% (actualmente ${totalW}%)`);return;}
  config.criteria=newCrit;config.rubricsConfigured=true;CRITERIA=newCrit;
  await saveAll();renderTeacherPanel();toast('✓ Rúbricas publicadas');
};

window.resetRubrics=async function(){
  config.criteria=null;config.rubricsConfigured=false;CRITERIA=[...DEFAULT_CRITERIA];
  await saveAll();renderTeacherPanel();toast('Rúbricas restauradas');
};


window.migrateGrades=async function(){
  if(!confirm('Migrar calificaciones de informatica2v2 al nodo /grades/\n\nEsto sincroniza las calificaciones actuales al portal central del maestro. ¿Continuar?'))return;
  const btn=document.getElementById('btn-migrate');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Migrando...';}
  try{
    const snap=await get(ref(db,'informatica2v2/grades'));
    if(!snap.exists()){toast('No hay calificaciones para migrar');if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-database-export"></i> Migrar calificaciones';}return;}
    const gradesData=snap.val();
    const promises=[];
    let count=0;
    for(const [mat,parciales] of Object.entries(gradesData)){
      const syncData={};
      for(const [pkey,criterios] of Object.entries(parciales||{})){
        const parcialLabel=pkey==='p1'?'parcial1':pkey==='p2'?'parcial2':'final';
        // Calculate weighted average for this parcial
        let total=0,hasAny=false;
        const detalle={};
        for(const [ckey,val] of Object.entries(criterios||{})){
          const crit=CRITERIA.find(c=>c.key===ckey);
          if(!crit)continue;
          let score=null;
          if(typeof val==='object'){
            const vals=Object.values(val).map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&v>=0);
            if(vals.length){score=vals.reduce((a,b)=>a+b,0)/vals.length;}
          } else {
            score=parseFloat(val);
            if(isNaN(score))score=null;
          }
          if(score!==null){
            total+=score*(crit.weight/100);
            hasAny=true;
            detalle[ckey]=parseFloat(score.toFixed(2));
          }
        }
        syncData[parcialLabel]={
          score:hasAny?parseFloat(Math.min(10,total).toFixed(2)):null,
          detalle,
          updated:Date.now(),
          materia:'informatica2'
        };
      }
      if(Object.keys(syncData).length){
        promises.push(set(ref(db,`grades/${mat}/informatica2`),syncData));
        count++;
      }
    }
    await Promise.all(promises);
    toast(`✓ ${count} alumnos migrados a /grades/{mat}/informatica2`);
  }catch(e){
    toast('Error en migración: '+e.message);
    console.error(e);
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-database-export"></i> Migrar calificaciones';}
  }
};

window.clearAllData=async function(){
  if(!confirm('¿Seguro que deseas borrar TODOS los datos?\n(calificaciones, asistencias, códigos, sesiones, foro)\n\nEsta acción NO se puede deshacer.'))return;
  if(!confirm('CONFIRMACIÓN FINAL: Se borrarán todos los datos del grupo. ¿Continuar?'))return;
  grades={};attendance={};codeSubmissions={};sessions={};questions=[];replies={};
  await saveAll();
  Object.keys(localStorage).filter(k=>k.startsWith('code_bk_')||k.startsWith('code_nm_')).forEach(k=>localStorage.removeItem(k));
  toast('Todos los datos han sido borrados');renderTeacherPanel();
};

function startApp(){
  showSection('students');
  showStudentLogin();

  // Wire ALL interactive elements via JS (bypass CSP inline-script restrictions)
  // Tab buttons
  const stuTab=document.getElementById('tab-students');
  const teaTab=document.getElementById('tab-teacher');
  if(stuTab)stuTab.onclick=(e)=>showTab('students',e);
  if(teaTab)teaTab.onclick=(e)=>showTab('teacher',e);

  // Student login: Entrar button + Enter key on select
  const stuBtn=document.getElementById('stu-entrar-btn')||document.querySelector('#stu-login .btn-primary');
  if(stuBtn)stuBtn.onclick=window.doLogin;
  const stuSel=document.getElementById('stu-sel');
  if(stuSel)stuSel.onkeydown=(e)=>{if(e.key==='Enter')window.doLogin();};

  // Teacher login: Entrar button + Enter key on password
  const teaBtn=document.getElementById('tea-entrar-btn')||document.querySelector('#tea-login .btn-primary');
  if(teaBtn)teaBtn.onclick=window.doTeacherLogin;
  const teaPwd=document.getElementById('tea-pwd');
  if(teaPwd)teaPwd.onkeydown=(e)=>{if(e.key==='Enter')window.doTeacherLogin();};
  const teaUser=document.getElementById('tea-user');
  if(teaUser)teaUser.onkeydown=(e)=>{if(e.key==='Enter')window.doTeacherLogin();};
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', startApp);
} else {
  startApp();
}
